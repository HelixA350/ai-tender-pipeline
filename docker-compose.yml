networks:
  shared-kafka:
    external: true


volumes:
  output:
  sqlite_data:

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    networks:
      - shared-kafka
    env_file:
      - .env
    ports:
      - "8003:8000"
    volumes:
      - output:/app/output
      - sqlite_data:/app/db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/db/tenders.db
      - DATABASE_URL_SYNC=sqlite:////app/db/tenders.db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - PYTHONPATH=/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    networks:
      - shared-kafka
    env_file:
      - .env
    volumes:
      - output:/app/output
      - sqlite_data:/app/db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/db/tenders.db
      - DATABASE_URL_SYNC=sqlite:////app/db/tenders.db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - PYTHONPATH=/app
      - WORKER_CONCURRENCY=1
      - CLEANUP_INTERVAL_MINUTES=60
      - CLEANUP_DB_RETENTION_DAYS=30
      - CLEANUP_ORPHAN_HOURS=24
    depends_on:
      api:
        condition: service_started
    command: python -m worker.tasks
    restart: unless-stopped

  webhook-sender:
    build:
      context: .
      dockerfile: Dockerfile.worker
    networks:
      - shared-kafka
    env_file:
      - .env
    volumes:
      - output:/app/output
      - sqlite_data:/app/db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/db/tenders.db
      - DATABASE_URL_SYNC=sqlite:////app/db/tenders.db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WEBHOOK_URL=${WEBHOOK_URL}
      - PYTHONPATH=/app
    command: python -m worker.webhook_sender
    restart: unless-stopped